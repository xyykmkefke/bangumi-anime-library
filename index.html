    }
    if (e.key === 'Escape' && !modalEl.hidden) { closeDetail(); return; }
    if (!modalEl.hidden) {
      // 详情内 ←/→ 连续浏览上一部 / 下一部，与列表外切换季度区分
      if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
        e.preventDefault();
        shiftDetail(e.key === 'ArrowLeft' ? -1 : 1);
        return;
      }
      // 焦点陷阱：Tab 在弹窗内循环，避免焦点跑到背后的列表
      if (e.key === 'Tab') {
        var nodes = modalEl.querySelectorAll('button, a[href], input, [tabindex]:not([tabindex="-1"])');
        var focusables = [];
        for (var fi = 0; fi < nodes.length; fi += 1) {
          if (!nodes[fi].disabled && nodes[fi].offsetParent !== null) focusables.push(nodes[fi]);
        }
        if (focusables.length) {
          var first = focusables[0];
          var last = focusables[focusables.length - 1];
          if (e.shiftKey && document.activeElement === first) {
            e.preventDefault();
            last.focus();
          } else if (!e.shiftKey && document.activeElement === last) {
            e.preventDefault();
            first.focus();
          }
        }
      }
      return;
    }
    var t = e.target;
    var typing = t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT' || t.isContentEditable);
    if (e.key === '?' && !typing) {
      e.preventDefault();
      $('help').hidden = false;
      return;
    }
    if (e.key === '/' && !typing) {
      e.preventDefault();
      searchEl.focus();
      return;
    }
    if (typing) return;
    if ((e.key === 't' || e.key === 'T') && !e.ctrlKey && !e.metaKey && !e.altKey) {
      e.preventDefault();
      toggleTheme();
      return;
    }
    if (e.key === 'ArrowLeft') { e.preventDefault(); shiftQuarter(-1); }
    else if (e.key === 'ArrowRight') { e.preventDefault(); shiftQuarter(1); }
    else if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      var cards = Array.prototype.slice.call(gridEl.querySelectorAll('.card'));
      if (!cards.length) return;
      e.preventDefault();
      var idx = cards.indexOf(document.activeElement);
      var next = idx < 0 ? 0 : idx + (e.key === 'ArrowDown' ? 1 : -1);
      if (next < 0) next = 0;
      if (next > cards.length - 1) next = cards.length - 1;
      cards[next].focus();
    }
  });

  function stamp() {
    var d = new Date();
    return d.getFullYear() + String(d.getMonth() + 1).padStart(2, '0') + String(d.getDate()).padStart(2, '0');
  }

  function download(filename, text, type) {
    var blob = new Blob([text], { type: type });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = filename;
    a.click();
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  }

  function sortedMine() {
    return Object.keys(myMap).sort(function (a, b) {
      return (myMap[b].t || 0) - (myMap[a].t || 0);
    });
  }

  function csvCell(v) {
    var s = String(v == null ? '' : v);
    return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  }

  $('exportBtn').addEventListener('click', function () {
    var ids = Object.keys(myMap).map(function (id) {
      var entry = myMap[id] || {};
      return { id: Number(id), status: entry.s || 'done', addedAt: entry.t || 0, ep: entry.ep || 0 };
    });
    var payload = {
      app: 'yuc-anime-list',
      version: 2,
      exportedAt: new Date().toISOString(),
      items: ids
    };
    download('我的番剧-' + stamp() + '.json', JSON.stringify(payload, null, 2), 'application/json');
    markBackup();
    toast('已导出 ' + ids.length + ' 部番剧');
  });

  $('exportCsv').addEventListener('click', function () {
    var rows = [['条目ID', '中文名', '原名', '类型', '地区', '首播', '总话数', '状态', '已看', '加入时间']];
    sortedMine().forEach(function (id) {
      var x = byId.get(id);
      var e = myMap[id];
      if (!x || !e) return;
      rows.push([
        id, x.cn || '', x.n || '', x.p || '', x.g || '', x.d || '', x.e || '',
        STATUS[e.s] || '看完', e.ep || 0, new Date(e.t || Date.now()).toLocaleString('zh-CN'),
      ]);
    });
    var csv = '\ufeff' + rows.map(function (r) {
      return r.map(csvCell).join(',');
    }).join('\r\n');
    download('我的番剧-' + stamp() + '.csv', csv, 'text/csv;charset=utf-8');
    markBackup();
    toast('已导出 CSV：' + (rows.length - 1) + ' 部');
  });

  $('exportMd').addEventListener('click', function () {
    var ids = sortedMine();
    var lines = [
      '# 我的番剧',
      '',
      '共 ' + ids.length + ' 部 · 导出于 ' + new Date().toLocaleString('zh-CN'),
      '',
      '| 番名 | 状态 | 进度 | 首播 |',
      '| --- | --- | --- | --- |',
    ];
    ids.forEach(function (id) {
      var x = byId.get(id);
      var e = myMap[id];
      if (!x || !e) return;
      var name = '[' + String(x.cn || x.n || '未知').replace(/\|/g, '\\|') + '](https://bgm.tv/subject/' + id + ')';
      var prog = (e.ep || 0) + (x.e ? ' / ' + x.e : '');
      lines.push('| ' + name + ' | ' + (STATUS[e.s] || '看完') + ' | ' + prog + ' | ' + (x.d || '—') + ' |');
    });
    download('我的番剧-' + stamp() + '.md', lines.join('\n'), 'text/markdown;charset=utf-8');
    markBackup();
    toast('已导出 Markdown：' + ids.length + ' 部');
  });

  $('importBtn').addEventListener('click', function () { $('fileInput').click(); });

  $('fileInput').addEventListener('change', function (e) {
    var file = e.target.files && e.target.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function () {
      try {
        var parsed = JSON.parse(String(reader.result));
        var raw = Array.isArray(parsed) ? parsed : (parsed.items || parsed.ids || []);
        var added = 0;
        var merged = 0;
        var skipped = 0;
        raw.forEach(function (entry, index) {
          var isObj = entry && typeof entry === 'object';
          var id = String(isObj ? entry.id : entry);
          if (!byId.has(id)) { skipped += 1; return; }
          var status = isObj && STATUS[entry.status] ? entry.status : 'done';
          var ep = Math.max(0, Math.round(Number(isObj && entry.ep) || 0));
          var cur = myMap[id];
          if (!cur) {
            myMap[id] = { s: status, t: (isObj && entry.addedAt) || (Date.now() + index), ep: ep };
            added += 1;
            return;
          }
          // 已有条目保留本地状态与加入时间，进度取较大值
          cur.ep = Math.max(Number(cur.ep) || 0, ep);
          merged += 1;
        });
        saveMine();
        render();
        toast('导入完成：新增 ' + added + ' 部，合并 ' + merged + ' 部' +
          (skipped ? '，跳过 ' + skipped + ' 条无效记录' : ''));
      } catch (err) {
        toast('导入失败：文件格式不正确');
      }
    };
    reader.readAsText(file);
    e.target.value = '';
  });

  $('clearBtn').addEventListener('click', function () {
    if (!Object.keys(myMap).length) { toast('列表已经是空的'); return; }
    if (!confirm('确定清空「我的番剧」吗？建议先导出备份。')) return;
    myMap = {};
    saveMine();
    render();
    toast('已清空我的番剧');
  });

  // 用户手动修改 hash（前进/后退或粘贴链接）时同步界面
  window.addEventListener('hashchange', function () {
    if (applyingHash) return;
    applyingHash = true;
    try {
      if (applyHash()) {
        var deep = hashDetail();
        syncControls();
        render();
        if (deep) openDetail(deep);
        else closeDetail();
      }
    } finally {
      applyingHash = false;
    }
  });

  // 回到顶部：滚动超过一屏后出现，点击平滑回顶
  var toTopEl = $('toTop');
  var toTopTick = false;
  function syncToTop() {
    var show = window.scrollY > 600;
    if (show === !toTopEl.hidden) return;
    toTopEl.hidden = !show;
  }
  window.addEventListener('scroll', function () {
    if (toTopTick) return;
    toTopTick = true;
    window.requestAnimationFrame(function () {
      toTopTick = false;
      syncToTop();
    });
  }, { passive: true });
  toTopEl.addEventListener('click', function () {
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });
  syncToTop();

  renderYears();
  renderSeasons();
  fillFilterOptions();
  var hashMap = parseHash();
  var fromHash = applyStateMap(hashMap);
  var prefs = fromHash ? null : loadPrefs();
  if (prefs) applyStateMap(prefs);
  // 既没有 hash 主题参数、也没有本地偏好时，跟随系统配色
  var hasThemePref = !!(hashMap && hashMap.t) || !!(prefs && prefs.t);
  if (!hasThemePref) state.theme = systemTheme();
  // 先读取深链再 render，避免 render 写 hash 时丢掉 d 参数
  var initialDetail = fromHash ? hashDetail() : null;
  syncControls();
  render();
  if (initialDetail) openDetail(initialDetail);
  $('dataHint').textContent = DATA.length
    ? '共 ' + DATA.length + ' 部 · ' + (META.startYear || '') + '–' + (META.endYear || '')
    : '数据未就绪';
  if (!canStore) {
    $('storageWarn').hidden = false;
  }
})();
</script>
<script>
  // 注册 Service Worker，提供应用壳与封面的离线缓存
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function () {});
    });
  }
</script>
</body>
</html>
